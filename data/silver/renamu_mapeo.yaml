# Mapeo del RENAMU a Silver 
tabla: renamu_finanzas
fuente: F3

# Identificación: todas las ediciones traen ccdd, ccpp y ccdi. El tipo cambia de nombre de columna según la
# edición; se toma la primera que exista. Los nombres (departamento, provincia, distrito) no se cargan: en Gold
# salen del SIAF por ubigeo.
identificacion:
  ubigeo: [CCDD, CCPP, CCDI]          # lpad 2 + lpad 2 + lpad 2
  tipo_municipalidad: [TIPOMUNI, CATMUNI]
  tipo_valores: {"1": PROVINCIAL, "2": DISTRITAL, "3": CENTRO POBLADO}   # 3 = catálogo del INEI; fuera de alcance (va en F02)

# Variables universales (formato 2020–2026). Montos en soles.
variables:
  ingresos:
    informo: "Municipalidad informante del cuadro de ingresos (1 = informó, 0 = no informó)"
    total: "Total de ingresos ejecutados (I+II+III+IV)"
    corrientes: "I. Ingresos corrientes"
    capital: "II. Ingresos de capital"
    transferencias: "III. Transferencias"
    financiamiento: "IV. Financiamiento"
  gastos:
    informo: "Municipalidad informante del cuadro de gastos (1 = informó, 0 = no informó)"
    total: "Total de gastos ejecutados (I+II+III)"
    corrientes: "I. Gastos corrientes"
    capital: "II. Gastos de capital"
    servicio_deuda: "III. Servicio de la deuda"

ediciones:
  2009:
    anio_dato: 2009
    confianza: media
    nota: "El PDF llama al cuadro de ingresos P103; el CSV usa P102 (mismos sufijos). No hay categoría III: las transferencias van dentro de los ingresos corrientes. La línea IV (P102_71) solo suma el endeudamiento; el saldo de balance (P102_74) va aparte, así que financiamiento = P102_71 + P102_74 (desde 2010 el saldo ya está dentro de la IV)."
    ingresos: {archivo: C094.csv, informo: VFI_P102, total: P102_01, corrientes: P102_02, capital: P102_60, transferencias: null, financiamiento: [P102_71, P102_74]}
